services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medigest-sqlserver
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - medigest_sqldata:/var/opt/mssql

volumes:
  medigest_sqldata:
