<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>No disponible · MediGest</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/medigest.css}">
</head>
<body class="mg-auth d-flex align-items-center">
<main class="container text-center" style="max-width: 480px;">
    <h1 class="h2 mg-marca">MediGest</h1>
    <div class="card mg-tarjeta mt-3"><div class="card-body p-4">
        <p class="display-6 mb-1" th:text="${status}">404</p>
        <p class="mb-3" th:text="${status == 403} ? 'No tiene permisos para ver esta página.' : (${status == 404} ? 'La página que busca no existe.' : 'No se pudo procesar la solicitud.')">Mensaje</p>
        <a class="btn btn-primary" th:href="@{/panel}">Ir al panel</a>
    </div></div>
</main>
</body>
</html>
