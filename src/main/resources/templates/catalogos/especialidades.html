<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Especialidades')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<main class="container-xl py-3" style="max-width: 960px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h4 mb-0">Especialidades</h1>
        <button class="btn btn-primary" type="button" data-bs-toggle="modal" data-bs-target="#modalCatalogo">Nueva especialidad</button>
    </div>

    <div class="card mg-tarjeta">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead><tr><th>Nombre</th><th>Descripción</th><th>Duración sugerida</th><th>Estado</th><th></th></tr></thead>
                <tbody>
                <tr th:each="e : ${items}">
                    <td th:text="${e.nombre}">Nombre</td>
                    <td th:text="${e.descripcion != null} ? ${e.descripcion} : '—'">—</td>
                    <td th:text="${e.duracionSugeridaMin} + ' min'">30 min</td>
                    <td><span class="badge" th:classappend="${e.activa} ? 'text-bg-success' : 'text-bg-secondary'" th:text="${e.activa} ? 'Activa' : 'Inactiva'">Activa</span></td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-outline-primary btn-sm" type="button" data-bs-toggle="modal" data-bs-target="#modalCatalogo"
                                th:data-id="${e.id}" th:data-nombre="${e.nombre}" th:data-descripcion="${e.descripcion}"
                                th:data-duracion-sugerida-min="${e.duracionSugeridaMin}">Editar</button>
                        <form class="d-inline" method="post" th:action="@{/especialidades/{id}/estado(id=${e.id})}">
                            <input type="hidden" name="activa" th:value="${!e.activa}">
                            <button class="btn btn-sm" th:classappend="${e.activa} ? 'btn-outline-danger' : 'btn-outline-success'" type="submit"
                                    th:text="${e.activa} ? 'Desactivar' : 'Activar'">Desactivar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(items)}"><td colspan="5" class="text-center text-secondary py-4">No hay especialidades.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<div class="modal fade" id="modalCatalogo" tabindex="-1" aria-labelledby="tituloCatalogo" aria-hidden="true">
    <div class="modal-dialog"><form class="modal-content" method="post" th:action="@{/especialidades}">
        <div class="modal-header"><h2 class="modal-title h5" id="tituloCatalogo">Especialidad</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button></div>
        <div class="modal-body">
            <input type="hidden" name="id" id="campoId">
            <div class="mb-3"><label class="form-label" for="campoNombre">Nombre</label>
                <input class="form-control" id="campoNombre" name="nombre" maxlength="80" required></div>
            <div class="mb-3"><label class="form-label" for="campoDescripcion">Descripción</label>
                <textarea class="form-control" id="campoDescripcion" name="descripcion" rows="2" maxlength="300"></textarea></div>
            <div class="mb-3"><label class="form-label" for="campoDuracionSugeridaMin">Duración sugerida (minutos)</label>
                <input type="number" class="form-control" id="campoDuracionSugeridaMin" name="duracionSugeridaMin" min="5" max="240" step="5" value="30" required></div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form></div>
</div>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/catalogos.js}"></script>
</body>
</html>
