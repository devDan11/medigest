<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Auditoría')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('admin')}"></nav>
<div th:replace="~{fragments/layout :: mensajes}"></div>

<main class="container-xl py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <h1 class="h4 mb-0">Auditoría</h1>
        <a class="btn btn-outline-success btn-sm"
           th:href="@{/auditoria/exportar(accion=${fAccion},email=${fEmail},resultado=${fResultado},desde=${fDesde},hasta=${fHasta})}">Exportar CSV</a>
    </div>

    <form class="card mg-tarjeta mb-3" method="get" th:action="@{/auditoria}">
        <div class="card-body row g-2 align-items-end">
            <div class="col-md-3">
                <label class="form-label small mb-1" for="accion">Acción</label>
                <input type="search" class="form-control form-control-sm" id="accion" name="accion" th:value="${fAccion}" placeholder="p. ej. CITA">
            </div>
            <div class="col-md-3">
                <label class="form-label small mb-1" for="email">Usuario</label>
                <input type="search" class="form-control form-control-sm" id="email" name="email" th:value="${fEmail}">
            </div>
            <div class="col-md-2">
                <label class="form-label small mb-1" for="resultado">Resultado</label>
                <select class="form-select form-select-sm" id="resultado" name="resultado">
                    <option value="">Todos</option>
                    <option th:each="x : ${resultados}" th:value="${x}" th:text="${x}" th:selected="${x == fResultado}"></option>
                </select>
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="desde">Desde</label>
                <input type="date" class="form-control form-control-sm" id="desde" name="desde" th:value="${fDesde}">
            </div>
            <div class="col-6 col-md-2">
                <label class="form-label small mb-1" for="hasta">Hasta</label>
                <input type="date" class="form-control form-control-sm" id="hasta" name="hasta" th:value="${fHasta}">
            </div>
            <div class="col-12 d-flex gap-2">
                <button class="btn btn-primary btn-sm" type="submit">Filtrar</button>
                <a class="btn btn-outline-secondary btn-sm" th:href="@{/auditoria}">Limpiar</a>
            </div>
        </div>
    </form>

    <div class="card mg-tarjeta">
        <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
                <thead><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Entidad</th><th>Recurso</th><th>Resultado</th><th>Detalle</th><th>IP</th></tr></thead>
                <tbody>
                <tr th:each="a : ${pagina.contenido}">
                    <td class="text-nowrap" th:text="${a.fecha != null} ? ${@fmt.fechaHora(a.fecha)} : '—'">fecha</td>
                    <td th:text="${a.usuarioEmail} ?: '—'">usuario</td>
                    <td><code th:text="${a.accion}">ACCION</code></td>
                    <td th:text="${a.entidad}">entidad</td>
                    <td th:text="${a.recursoId} ?: '—'">1</td>
                    <td><span class="badge" th:text="${a.resultado}"
                              th:classappend="${a.resultado.name() == 'EXITO'} ? 'text-bg-success' : (${a.resultado.name() == 'FALLO'} ? 'text-bg-danger' : 'text-bg-warning')">EXITO</span></td>
                    <td class="small" th:text="${a.detalle} ?: ''">detalle</td>
                    <td class="small text-nowrap" th:text="${a.ip} ?: ''">ip</td>
                </tr>
                <tr th:if="${#lists.isEmpty(pagina.contenido)}"><td colspan="8" class="text-center text-secondary py-4">No hay eventos con esos filtros.</td></tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white d-flex justify-content-between align-items-center" th:if="${pagina.totalPaginas > 1}">
            <span class="small text-secondary" th:text="${pagina.totalElementos} + ' eventos · página ' + ${pagina.pagina + 1} + ' de ' + ${pagina.totalPaginas}"></span>
            <div class="btn-group">
                <a class="btn btn-outline-secondary btn-sm" th:classappend="${pagina.pagina == 0} ? 'disabled'"
                   th:href="@{/auditoria(accion=${fAccion},email=${fEmail},resultado=${fResultado},desde=${fDesde},hasta=${fHasta},pagina=${pagina.pagina - 1})}">Anterior</a>
                <a class="btn btn-outline-secondary btn-sm" th:classappend="${pagina.pagina + 1 >= pagina.totalPaginas} ? 'disabled'"
                   th:href="@{/auditoria(accion=${fAccion},email=${fEmail},resultado=${fResultado},desde=${fDesde},hasta=${fHasta},pagina=${pagina.pagina + 1})}">Siguiente</a>
            </div>
        </div>
    </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
<script th:src="@{/js/medigest.js}"></script>
</body>
</html>
