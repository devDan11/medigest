<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contraseña · MediGest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/medigest.css}">
</head>
<body class="mg-auth d-flex align-items-center">
<main class="container" style="max-width: 440px;">
    <div class="text-center mb-4"><h1 class="h2 mg-marca">MediGest</h1></div>
    <div class="card mg-tarjeta">
        <div class="card-body p-4">
            <h2 class="h5 mb-3">Recuperar contraseña</h2>
            <div class="alert alert-success" role="alert" th:if="${param.enviado}">
                Si el correo está registrado, recibirá un enlace para restablecer su contraseña.
                El enlace vence en pocos minutos.
            </div>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <p class="text-secondary small">Ingrese el correo de su cuenta y le enviaremos un enlace temporal.</p>
            <form th:action="@{/recuperar}" method="post">
                <div class="mb-3">
                    <label for="email" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="email" name="email" maxlength="150" required autofocus>
                </div>
                <button type="submit" class="btn btn-primary w-100">Enviar enlace</button>
            </form>
            <div class="mt-3 small"><a th:href="@{/login}">Volver a iniciar sesión</a></div>
        </div>
    </div>
</main>
</body>
</html>
