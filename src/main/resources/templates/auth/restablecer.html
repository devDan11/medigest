<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nueva contraseña · MediGest</title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/css/medigest.css}">
</head>
<body class="mg-auth d-flex align-items-center">
<main class="container" style="max-width: 440px;">
    <div class="text-center mb-4"><h1 class="h2 mg-marca">MediGest</h1></div>
    <div class="card mg-tarjeta">
        <div class="card-body p-4">
            <h2 class="h5 mb-3">Establecer nueva contraseña</h2>
            <div class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></div>
            <form th:action="@{/restablecer}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label for="password" class="form-label">Nueva contraseña</label>
                    <input type="password" class="form-control" id="password" name="password" minlength="8"
                           maxlength="72" autocomplete="new-password" required autofocus>
                    <div class="form-text">8 a 72 caracteres, con al menos una letra y un número.</div>
                </div>
                <div class="mb-3">
                    <label for="confirmacion" class="form-label">Repita la contraseña</label>
                    <input type="password" class="form-control" id="confirmacion" name="confirmacion"
                           maxlength="72" autocomplete="new-password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar contraseña</button>
            </form>
            <div class="mt-3 small"><a th:href="@{/recuperar}">Solicitar un enlace nuevo</a></div>
        </div>
    </div>
</main>
</body>
</html>
