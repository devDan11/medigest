<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inicio · MediGest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/medigest.css}">
</head>
<body class="mg-auth">
<nav class="navbar bg-white shadow-sm">
    <div class="container">
        <span class="navbar-brand mg-marca">MediGest</span>
        <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3 mb-0">
            <span class="small text-secondary" th:text="${email}">usuario</span>
            <button type="submit" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
        </form>
    </div>
</nav>
<main class="container py-5" style="max-width: 760px;">
    <div class="card mg-tarjeta">
        <div class="card-body p-4">
            <h1 class="h4">Sesión iniciada</h1>
            <p class="mb-2">Cuenta: <strong th:text="${email}">correo</strong></p>
            <p class="mb-3">Roles:
                <span class="badge text-bg-primary me-1" th:each="r : ${roles}" th:text="${r}">ROL</span>
            </p>
            <p class="text-secondary mb-0">
                La autenticación y el control de acceso están activos. El panel de cada rol
                (dashboard, agenda y calendario) se incorpora en la Fase 6.
            </p>
        </div>
    </div>
</main>
</body>
</html>
