<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · MediGest'">MediGest</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/medigest.css}">
</head>
<body>

<!-- Barra de navegación: las opciones dependen del rol (la autorización real se aplica en el backend). -->
<nav class="navbar navbar-expand-lg bg-white shadow-sm mg-nav" th:fragment="navbar(activo)">
    <div class="container-xl">
        <a class="navbar-brand mg-marca" th:href="@{/panel}">MediGest</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal" aria-expanded="false" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menuPrincipal">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'panel'} ? 'active'" th:href="@{/panel}">Panel</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'citas'} ? 'active'" th:href="@{/citas}"
                                        th:text="${mgPaciente} ? 'Mis citas' : (${mgMedico} ? 'Mi agenda' : 'Citas')">Citas</a></li>
                <li class="nav-item" th:if="${mgPersonal or mgPaciente}"><a class="nav-link" th:classappend="${activo == 'nueva'} ? 'active'" th:href="@{/citas/nueva}">Reservar</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activo == 'calendario'} ? 'active'" th:href="@{/calendario}">Calendario</a></li>
                <li class="nav-item" th:if="${mgPersonal or mgPaciente}"><a class="nav-link" th:classappend="${activo == 'espera'} ? 'active'" th:href="@{/lista-espera}">Lista de espera</a></li>
                <li class="nav-item" th:if="${mgPersonal}"><a class="nav-link" th:classappend="${activo == 'pacientes'} ? 'active'" th:href="@{/pacientes}">Pacientes</a></li>
                <li class="nav-item" th:if="${mgPersonal}"><a class="nav-link" th:classappend="${activo == 'medicos'} ? 'active'" th:href="@{/medicos}">Médicos</a></li>
                <li class="nav-item" th:if="${mgMedico}"><a class="nav-link" th:classappend="${activo == 'medicos'} ? 'active'" th:href="@{/medicos/mio}">Mi horario</a></li>
                <li class="nav-item" th:if="${mgPersonal or mgMedico}"><a class="nav-link" th:classappend="${activo == 'bloqueos'} ? 'active'" th:href="@{/bloqueos}">Bloqueos</a></li>
                <li class="nav-item dropdown" th:if="${mgAdmin}">
                    <a class="nav-link dropdown-toggle" th:classappend="${activo == 'admin'} ? 'active'" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">Administración</a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/especialidades}">Especialidades</a></li>
                        <li><a class="dropdown-item" th:href="@{/consultorios}">Consultorios</a></li>
                        <li><a class="dropdown-item" th:href="@{/usuarios}">Usuarios</a></li>
                    </ul>
                </li>
                <li class="nav-item" th:if="${mgPaciente}"><a class="nav-link" th:classappend="${activo == 'perfil'} ? 'active'" th:href="@{/perfil}">Mi perfil</a></li>
            </ul>
            <form th:action="@{/logout}" method="post" class="d-flex align-items-center gap-3 mb-0">
                <span class="small text-secondary" th:text="${mgEmail}">usuario</span>
                <button type="submit" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
            </form>
        </div>
    </div>
</nav>

<!-- Mensajes de resultado (éxito / error de negocio) tras una acción. -->
<div class="container-xl pt-3" th:fragment="mensajes">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mgOk}">
        <span th:text="${mgOk}">Hecho</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" role="alert" th:if="${mgError}">
        <span th:text="${mgError}">Error</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Cerrar"></button>
    </div>
</div>

<script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
