spring:
  application:
    name: medigest
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:MediGestDB};encrypt=${DB_ENCRYPT:true};trustServerCertificate=${DB_TRUST_SERVER_CERTIFICATE:false}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate        # el esquema lo gestiona solo Flyway
    properties:
      hibernate:
        jdbc:
          # Sin jdbc.time_zone: LocalTime (horarios) es hora de pared de la clinica y no debe desplazarse.
          # Los Instant se guardan en DATETIMEOFFSET(6) con offset UTC explicito, sin depender de esta opcion.
          batch_size: 25
        format_sql: true
        default_batch_fetch_size: 25

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  thymeleaf:
    cache: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

medigest:
  timezone: America/Lima
  aplicacion:
    url-base: ${APP_URL_BASE:http://localhost:8080}   # base de los enlaces de recuperación
  seguridad:
    swagger-publico: false          # true solo en dev; en otro caso Swagger exige rol ADMINISTRADOR
    recuperacion-minutos: 30
    bloqueo:
      max-intentos: 5
      minutos: 15
    jwt:
      secreto: ${JWT_SECRET:}       # >= 32 caracteres; en prod es obligatoria
      emisor: MediGest
      acceso-minutos: 15
      refresco-minutos: 10080       # 7 días

logging:
  level:
    root: INFO
    com.medigestsystem: INFO
